services:
  sqlserver:
    container_name: spp-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "admin123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "admin123!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  studieplusplus.api:
    container_name: spp-api
    image: studieplusplus.api
    build:
      context: .
      dockerfile: src/server-api/StudiePlusPlus.API/Dockerfile
    ports:
      - "5168:8080"
      - "5169:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started

  studieplusplus.app:
    container_name: spp-app
    build:
      context: src/client-app/studieplusplusgui
      dockerfile: Dockerfile
    ports:
      - "5172:80"
    restart: unless-stopped

  dashboard:
    container_name: spp-dashboard
    build:
      context: docker/dashboard
      dockerfile: Dockerfile
    ports:
      - "5170:80"
    restart: unless-stopped

  uptime-kuma:
    container_name: spp-uptime-kuma
    image: louislam/uptime-kuma:1
    ports:
      - "5173:3001"
    volumes:
      - ./docker/uptime-kuma-data:/app/data
    restart: unless-stopped

  uptime-kuma-setup:
    container_name: spp-uptime-kuma-setup
    build:
      context: ./docker/uptime-kuma-setup
    depends_on:
      - uptime-kuma
    volumes:
      - ./docker/uptime-kuma-data:/data
    restart: "no"

  seq:
    container_name: spp-seq
    image: datalust/seq:latest
    ports:
      - "5171:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "admin123!"
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  seq-data:
